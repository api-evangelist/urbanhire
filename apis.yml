description: UrbanHire was an Indonesian all-in-one hiring and assessment platform (applicant
  tracking system) backed by 500 Global, designed to streamline recruitment and help employers
  hire the right talent. The company appears defunct - urbanhire.com has been offline behind
  Cloudflare (HTTP 530) with the last archived homepage from January 2021 - and it never
  published a public API or developer documentation. Its GitHub organization and first-party
  npm engineering packages remain the surviving technical footprint.
